name: english-learning-be

# Tên service đặt riêng (english-learning-*) để không trùng DNS với service
# của dự án khác khi nối chung network với reverse proxy (Caddy của pos-saas).
services:
  english-learning-be:
    build: .
    image: english-learning-be:latest
    container_name: english-learning-be
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Ghi đè MONGODB_URI trong .env: trỏ tới container mongo bên dưới.
      # Replica set là bắt buộc vì code dùng MongoDB transaction.
      MONGODB_URI: mongodb://english-learning-mongo:27017/?replicaSet=rs0
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Chỉ mở cho localhost của VPS (để curl kiểm tra); Caddy gọi qua docker network.
      - "127.0.0.1:${API_HOST_PORT:-5000}:5000"
    depends_on:
      english-learning-mongo:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  english-learning-mongo:
    image: mongo:8.0
    container_name: english-learning-mongo
    restart: unless-stopped
    # Giới hạn cache RAM vì VPS dùng chung với dự án khác (tăng nếu VPS nhiều RAM).
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    # Tự khởi tạo replica set một nút ở lần chạy đầu, các lần sau chỉ kiểm tra trạng thái.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'english-learning-mongo:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
